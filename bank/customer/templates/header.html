
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Management Header</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        .bank-header {
            background: #103b70;
            color: white;
            width: 100%;
        }

        .brand-section {
            padding: 15px 35px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .bank-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bank-logo i {
            font-size: 38px;
            color: #ffffff;
        }

        .bank-logo h3 {
            font-size: 23px;
            font-weight: 700;
            margin: 0;
        }

        .bank-logo p {
            font-size: 12px;
            margin: 3px 0 0;
            color: #d5e5f5;
        }

        .header-login a {
            text-decoration: none;
            background: white;
            color: #103b70;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
        }

        .header-login a:hover {
            background: #dceaf8;
        }

        .nav-section {
            background: #174f85;
            padding: 0 35px;
        }

        .nav-section .navbar {
            padding: 0;
        }

        .nav-section .navbar-nav {
            gap: 10px;
        }

        .nav-section .nav-link {
            color: white;
            padding: 15px 13px !important;
            font-size: 14px;
            font-weight: 500;
        }

        .nav-section .nav-link:hover,
        .nav-section .nav-link.active {
            background: #2678b9;
            color: white;
        }

        .navbar-toggler {
            border-color: white;
        }

        .navbar-toggler-icon {
            filter: brightness(0) invert(1);
        }

        @media(max-width: 768px) {
            .brand-section {
                padding: 15px;
            }

            .bank-logo h3 {
                font-size: 18px;
            }

            .bank-logo i {
                font-size: 30px;
            }

            .nav-section {
                padding: 0 15px;
            }

            .nav-section .nav-link {
                padding: 10px !important;
            }
        }
    </style>
</head>

<body>

<header class="bank-header">

    <!-- Brand Section -->
    <div class="brand-section">

        <div class="bank-logo">
            <i class="bi bi-bank"></i>

            <div>
                <h3>KERALA BANK</h3>
                <p>Bank Management System</p>
            </div>
        </div>

        <div class="header-login">
            <a href="login.html">
                <i class="bi bi-person-circle"></i> Login
            </a>
        </div>

    </div>

    <!-- Navigation Bar -->
    <div class="nav-section">

        <nav class="navbar navbar-expand-lg">

            <button class="navbar-toggler my-2" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#bankNavbar"
                aria-controls="bankNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="bankNavbar">

                <ul class="navbar-nav">

                    <li class="nav-item">
                        <a class="nav-link active" href="{% url 'index' %}">
                            <i class="bi bi-house-door"></i> Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'about_us' %}">
                            <i class="bi bi-bank"></i> About Us
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'services' %}">
                            <i class="bi bi-grid"></i> Services
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'customers' %}">
                            <i class="bi bi-people"></i> Customers
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'accounts' %}">
                            <i class="bi bi-wallet2"></i> Accounts
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'loan' %}">
                            <i class="bi bi-cash-stack"></i> Loans
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'contact' %}">
                            <i class="bi bi-telephone"></i> Contact
                        </a>
                    </li>

                </ul>

            </div>

        </nav>

    </div>

</header>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
