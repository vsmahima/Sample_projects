{% extends "base.html" %}
{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - HealthCare Hospital</title>

    <style>
        body {
            margin: 0;
            padding: 30px;
            font-family: Arial, sans-serif;
            background-color: #f4fafa;
        }

        .contact-container {
            max-width: 900px;
            margin: 20px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 2px 10px #dddddd;
        }

        h1 {
            text-align: center;
            color: #008080;
        }

        .contact-info {
            text-align: center;
            margin-bottom: 30px;
            color: #555555;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .contact-form input,
        .contact-form textarea {
            padding: 12px;
            border: 1px solid #cccccc;
            border-radius: 5px;
            font-size: 16px;
            font-family: Arial, sans-serif;
        }

        .contact-form textarea {
            height: 120px;
            resize: vertical;
        }

        .contact-form button {
            padding: 12px;
            background-color: #008080;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        .contact-form button:hover {
            background-color: #006666;
        }
    </style>
</head>
<body>

    <div class="contact-container">

        <h1>Contact Us</h1>

        <div class="contact-info">
            <p>We are here to help you. Contact us for appointments
            and other enquiries.</p>
            <p><strong>Phone:</strong> +91 98765 43210</p>
            <p><strong>Email:</strong> info@healthcare.com</p>
            <p><strong>Address:</strong> Main Road, Kerala, India</p>
        </div>

        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>

            <input type="email" placeholder="Your Email" required>

            <input type="text" placeholder="Subject" required>

            <textarea placeholder="Your Message" required></textarea>

            <button type="submit">Send Message</button>
        </form>

    </div>

</body>
</html>
{% endblock %}
